<html>
    <head>
        <title>bai 1 html</title>
        <link rel="stylesheet" href="main.css">

        <style>
            .Khoa {
                color: red;
                font-size: 200px;
            }
        </style>
    </head>

    <body>
        Môn phát triển ứng dụng Web + BTL
        <div class="Khoa">Khoa _AY</div>

        <!-- Đây là chú thích -->

        <p>Thẻ p là thẻ phân đoạn</p>

        <!-- Thẻ h là thẻ định dạng đề mục -->

        <h3>Thẻ H3</h3>

        <!-- Thẻ br để xuống dòng -->

        <!-- Thẻ div và span để chia phân đoạn -->

         <span>Đây là thẻ SPAN</span>

         <b>Thẻ b</b>
         <i>Thẻ i</i>

         <div>
            <font face="verdana">Môn PTUD Web</font>
            <font color="purple">Nhóm 03</font>
