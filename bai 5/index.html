<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bài 5</title>
    <link rel="stylesheet" href="style.css" type="text/css">
    <style>
        /* Internal Style */
        h2 {
            background: linear-gradient(45deg, #ff0000, #00ff00, #0000ff);
            background-clip: text;
            -webkit-text-fill-color: transparent;
            font-size: 48px;
            font-weight: bold;
        }

        #Khoakk {
            color: rgb(82, 118, 151);
        }

        .TL {
            color: #0000ff;
        }
    </style>
</head>

<body>
    <!-- Kiểu 1: Viết Style trong thẻ -->
    <!-- Loại 1: Inline style -->
    <h1 style="color: rebeccapurple;">HUMG</h1>

    <!-- Kiểu 2: Viết Style ngoài thẻ -->
    <!-- Loại 2: Internal Style -->
    <h2>Khoa _AY</h2>

    <h3>Trung trẻ trâu</h3>

    <!-- Selector -->
    <!-- Cách 1: Dùng tên thẻ -->

    <!-- Cách 2: Dùng id -->
    <h3 id="Khoakk">Khoa khờ khạo</h3>

    <!-- Cách 3: Dùng class -->
    <h3 class="TL">
        Thu đi để lại lá vàng
        Thái Lan để lại muôn vàn nỗi đau
        Mãi mãi là kẻ đến sau
        Mấy đời con cháu thay nhau về nhì
    </h3>
</body>

</html>
